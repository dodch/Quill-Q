<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .fav-light { display: block; }
    .fav-dark { display: none; }
    @media (prefers-color-scheme: dark) {
      .fav-light { display: none; }
      .fav-dark { display: block; }
    }
  </style>
  <image class="fav-light" href="data:image/png;base64," width="32" height="32" />
  <image class="fav-dark" href="data:image/png;base64," width="32" height="32" />
</svg>