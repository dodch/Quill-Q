<!DOCTYPE html>
<html lang="en" class="allow-scroll">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>Document Editor – Quill-Q</title>
  <meta name="description" content="Quill-Q full-page distraction-free BlockNote rich text editor." />

  <!-- Theme Color -->
  <meta name="theme-color" content="#faf8f5" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="shortcut icon" href="favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />

  <!-- Fonts & Icons -->
  <link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com" />
  <link rel="dns-prefetch" href="https://firestore.googleapis.com" />
  <link rel="preconnect" href="https://quill-push-dispatcher.dodchadam.workers.dev" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Outfit:wght@400;500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-solid-rounded/css/uicons-solid-rounded.css" />
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-regular-rounded/css/uicons-regular-rounded.css" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="styles.min.css?v=85" />
  <link rel="stylesheet" href="libs/blocknote-react.bundle.css?v=3" />

  <style>
    html, body {
      height: auto !important;
      min-height: 100vh !important;
      overflow-x: hidden !important;
      overflow-y: auto !important;
    }

    @media print {
      /* Completely hide floating pin trigger and pinned notes drawer/sidebar */
      .mobile-pinned-notes-trigger,
      #mobile-pinned-notes-trigger,
      .pinned-notes-sidebar,
      #pinned-notes-sidebar,
      .pinned-drawer-backdrop,
      #pinned-drawer-backdrop,
      #pinned-note-modal,
      .btn-create-pinned-note {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }

      /* Hide editor navigation, rails, menus and editing helpers */
      .editor-top-bar,
      .editor-top-bar-spacer,
      .editor-title-card,
      .editor-type-badge,
      .btn-submit-exercise,
      .exercise-banner,
      .submissions-drawer,
      .submissions-drawer-backdrop,
      .a4-right-page-rail,
      .a4-page-break-divider,
      .a4-btn-remove-page,
      .bn-side-menu,
      .bn-drag-handle,
      .bn-toolbar,
      .bn-menu,
      .editor-more-menu,
      .inapp-toast-container,
      .custom-dialog-backdrop,
      .task-modal-backdrop {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }

      /* Clean sheet styling for paper / PDF export */
      html, body {
        background: #ffffff !important;
        background-color: #ffffff !important;
        margin: 0 !important;
        padding: 0 !important;
        overflow: visible !important;
        height: auto !important;
        min-height: auto !important;
      }

      .editor-page {
        background: #ffffff !important;
        padding: 0 !important;
        margin: 0 !important;
      }

      .editor-main-canvas {
        max-width: 100% !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
      }

      .multipage-editor-root {
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
      }

      .a4-pages-canvas {
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
      }

      .a4-page-container {
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
      }

      .a4-page-sheet {
        width: 100% !important;
        max-width: 100% !important;
        box-shadow: none !important;
        border: 1.5px solid #1a1816 !important;
        border-radius: 8px !important;
        margin: 0 0 16px 0 !important;
        animation: none !important;
        transform: none !important;
        page-break-after: always !important;
        break-after: page !important;
        box-sizing: border-box !important;
      }

      .a4-page-container:last-child .a4-page-sheet,
      .a4-page-container:last-of-type .a4-page-sheet {
        page-break-after: auto !important;
        break-after: auto !important;
        margin-bottom: 0 !important;
      }
    }
  </style>
</head>
<body class="editor-page">

  <!-- Clean, Minimal Sticky Top Bar -->
  <header class="editor-top-bar">
    <div class="editor-bar-left">
      <a href="subject.html" class="editor-back-btn" id="editor-back-btn" title="Back to Subject" aria-label="Back to Subject">
        <i class="fi fi-rr-arrow-left"></i>
      </a>

      <!-- Subject & Doc Type Breadcrumb (Simple inline text, no boxes/buttons) -->
      <div class="editor-nav-breadcrumb" id="editor-nav-breadcrumb">
        <span class="editor-subject-badge card-peach" id="editor-subject-badge">
          <span id="editor-subject-name">Subject</span>
        </span>
        <span class="editor-type-badge view-hidden" id="editor-type-badge" title="Document Type">
          <i class="fi fi-rr-edit" id="editor-type-icon" style="display:none;"></i>
          <span class="editor-type-dot">.</span>
          <span id="editor-type-label">exercise</span>
        </span>
      </div>

      <!-- Document Author & Editor Badge (Compact Avatar + Floating Tooltip) -->
      <div class="editor-author-chip view-hidden" id="editor-author-chip" tabindex="0" role="region" aria-label="Author & editor info">
        <div class="editor-author-avatars" id="editor-author-avatars"></div>
        <div class="editor-author-tooltip" id="editor-author-tooltip" role="tooltip">
          <div class="author-tooltip-row">
            <span class="author-tooltip-role">Written by</span>
            <span class="author-tooltip-name" id="editor-author-by">Student</span>
          </div>
          <div class="author-tooltip-row is-editor-row" id="editor-author-edited-wrap" style="display: none;">
            <span class="author-tooltip-role">Edited by</span>
            <span class="author-tooltip-name" id="editor-author-edited"></span>
          </div>
        </div>
      </div>
    </div>

    <div class="editor-bar-right">
      <!-- Undo / Redo Buttons -->
      <div class="editor-history-group" id="editor-history-group" role="group" aria-label="Undo and redo history" style="display: none;">
        <button type="button" class="editor-btn-secondary btn-editor-history" id="btn-editor-undo" title="Undo (Ctrl+Z)" aria-label="Undo" disabled>
          <i class="fi fi-rr-undo"></i>
        </button>
        <button type="button" class="editor-btn-secondary btn-editor-history" id="btn-editor-redo" title="Redo (Ctrl+Y)" aria-label="Redo" disabled>
          <i class="fi fi-rr-redo"></i>
        </button>
      </div>

      <!-- Teacher Submissions Button -->
      <button type="button" class="editor-btn-secondary view-hidden" id="btn-view-submissions" title="View student submissions">
        <i class="fi fi-rr-users"></i>
        <span id="submissions-btn-text">Submissions (0)</span>
      </button>

      <!-- Student Submit Exercise Button -->
      <button type="button" class="editor-btn-primary btn-submit-exercise view-hidden" id="btn-submit-exercise" title="Turn in your worksheet">
        <i class="fi fi-rr-paper-plane"></i>
        <span id="btn-submit-exercise-text">Turn In</span>
      </button>

      <!-- Quick Highlighter Button -->
      <button type="button" class="editor-btn-secondary btn-highlighter-mode" id="btn-highlighter-mode" title="Quick Highlighter: Select text to highlight instantly (or hold Ctrl to multi-select)" aria-label="Quick Highlighter" style="display: none;">
        <i class="fi fi-rr-marker" style="color: #f59f00;"></i>
        <span id="highlighter-btn-label">Highlight</span>
      </button>

      <!-- Pen Button (Teacher Red Pen or Student Drawing Pen) -->
      <button type="button" class="editor-btn-secondary btn-teacher-pen view-hidden" id="btn-teacher-pen" title="Handwriting Pen: Draw marks & notes directly on paper" aria-label="Pen">
        <i class="fi fi-rr-pen-nib" id="nav-pen-icon" style="color: #e03131;"></i>
        <span id="teacher-pen-btn-label">Red Pen</span>
      </button>

      <!-- Add Pinned Note Button -->
      <button type="button" class="editor-btn-secondary btn-create-pinned-note" id="btn-create-pinned-note" title="Pin a note to side (up to 3)" style="display: none;">
        <i class="fi fi-rr-plus"></i>
        <span>Note</span>
      </button>

      <!-- More Actions Dropdown -->
      <div class="editor-more-dropdown-wrap" id="editor-more-dropdown-wrap">
        <button type="button" class="editor-btn-secondary btn-editor-more" id="btn-editor-more" title="More options" aria-label="More options">
          <i class="fi fi-rr-menu-dots-vertical"></i>
        </button>
        <div class="editor-more-menu view-hidden" id="editor-more-menu" role="menu">
          <button type="button" class="editor-menu-item view-hidden" id="btn-toggle-type" role="menuitem">
            <i class="fi fi-rr-exchange"></i>
            <span id="btn-toggle-type-text">Convert to Exercise</span>
          </button>
          <button type="button" class="editor-menu-item" id="btn-print-doc" role="menuitem">
            <i class="fi fi-rr-print"></i>
            <span>Print / PDF (A4)</span>
          </button>
        </div>
      </div>

      <!-- Primary Save Document & Live Status Button -->
      <button type="button" class="editor-btn-primary editor-btn-save state-saved" id="btn-save-doc" title="All changes saved (Ctrl+S)" style="display: none;">
        <i class="fi fi-rr-check" id="btn-save-icon"></i>
        <span id="btn-save-text">Saved</span>
      </button>
    </div>
  </header>

  <!-- Spacer behind fixed header -->
  <div class="editor-top-bar-spacer" aria-hidden="true"></div>

  <!-- Multi-Page Document Canvas -->
  <main class="editor-main-canvas">
    <!-- Student Exercise Banner -->
    <div class="exercise-banner student-banner view-hidden" id="exercise-student-banner">
      <div class="exercise-banner-left">
        <span class="exercise-banner-status" id="exercise-status-badge">🟡 In Progress</span>
        <span class="exercise-banner-desc" id="exercise-status-desc">This is your personal worksheet. Answers auto-save as you type. When finished, click <strong>Turn In</strong>!</span>
      </div>
      <div class="exercise-banner-actions">
        <button type="button" class="editor-btn-primary btn-banner-submit" id="btn-banner-submit">
          <i class="fi fi-rr-paper-plane"></i>
          <span id="btn-banner-submit-text">Turn In</span>
        </button>
      </div>
    </div>

    <!-- Teacher Review Banner (when inspecting student work) -->
    <div class="exercise-banner review-banner view-hidden" id="exercise-review-banner">
      <div class="exercise-banner-left">
        <img src="assets/avatar.jpg" alt="Student" class="exercise-review-avatar" id="exercise-review-avatar" referrerpolicy="no-referrer" onerror="this.src='assets/avatar.jpg'" />
        <div>
          <span class="exercise-review-title">Reviewing Submission: <strong id="exercise-review-student-name">Student</strong></span>
          <span class="exercise-review-status" id="exercise-review-status">Submitted</span>
        </div>
      </div>
      <div class="exercise-banner-actions">
        <button type="button" class="editor-btn-secondary btn-review-pen" id="btn-review-pen" title="Grade with handwritten red pen">
          <i class="fi fi-rr-pen-nib" style="color: #e03131;"></i>
          <span>Red Pen</span>
        </button>
        <button type="button" class="editor-btn-primary btn-save-review-marks" id="btn-save-review-marks" title="Save handwritten marks to student submission">
          <i class="fi fi-rr-check"></i>
          <span>Save Marks</span>
        </button>
        <button type="button" class="editor-btn-secondary" id="btn-exit-review">
          <i class="fi fi-rr-arrow-left"></i>
          <span>Back to Master</span>
        </button>
      </div>
    </div>

    <!-- Editable Title Card -->
    <div class="editor-title-card">
      <input 
        type="text" 
        id="doc-title-input" 
        class="editor-doc-title-input" 
        placeholder="Untitled Document..." 
        autocomplete="off"
        spellcheck="true"
        aria-label="Document Title"
      />
    </div>

    <!-- MultiPage BlockNote Mounting Node -->
    <div id="blocknote-editor-container">
      <!-- MultiPageBlockNoteApp mounts here -->
    </div>
  </main>

  <!-- Submissions Drawer (Teacher Only) -->
  <aside class="submissions-drawer view-hidden" id="submissions-drawer" aria-label="Student Submissions">
    <div class="submissions-drawer-header">
      <div class="submissions-header-left">
        <i class="fi fi-rr-users"></i>
        <span class="submissions-drawer-title">Student Submissions</span>
      </div>
      <button type="button" class="btn-close-submissions-drawer" id="btn-close-submissions-drawer" aria-label="Close submissions">&times;</button>
    </div>
    <div class="submissions-summary-bar" id="submissions-summary-bar">
      <span id="submissions-summary-count">Loading submissions...</span>
    </div>
    <div class="submissions-students-list" id="submissions-students-list">
      <!-- Populated dynamically -->
    </div>
  </aside>
  <div class="submissions-drawer-backdrop view-hidden" id="submissions-drawer-backdrop"></div>

  <!-- Mobile Floating Pin Trigger Button -->
  <button type="button" class="mobile-pinned-notes-trigger view-hidden" id="mobile-pinned-notes-trigger" aria-label="View pinned notes" title="View pinned notes">
    <i class="fi fi-sr-thumbtack"></i>
    <span class="mobile-pin-badge" id="mobile-pin-badge">0</span>
  </button>

  <!-- Mobile Drawer Backdrop Overlay -->
  <div class="pinned-drawer-backdrop view-hidden" id="pinned-drawer-backdrop"></div>

  <!-- Pinned Static Notes on Left Side (Unscrollable on desktop, slide-out drawer on mobile) -->
  <aside class="pinned-notes-sidebar" id="pinned-notes-sidebar" aria-label="Pinned Notes">
    <div class="pinned-notes-drawer-header">
      <span class="pinned-drawer-title"><i class="fi fi-sr-thumbtack"></i> Pinned Notes</span>
      <button type="button" class="btn-close-pinned-drawer" id="btn-close-pinned-drawer" aria-label="Close pinned notes">&times;</button>
    </div>
    <div class="pinned-notes-list" id="pinned-notes-list"></div>
  </aside>

  <!-- Modal: Create Pinned Paper Note -->
  <div class="task-modal-backdrop view-hidden" id="pinned-note-modal" style="z-index: 99998;">
    <div class="task-modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-pinned-note-title" style="max-width: 440px;">
      <div class="task-modal-header">
        <h3 class="task-modal-title" id="modal-pinned-note-title">Pin a Note</h3>
        <button type="button" class="task-modal-close" id="modal-pinned-note-close" aria-label="Close modal">&times;</button>
      </div>
      <form class="task-modal-form" id="pinned-note-form">
        <div class="modal-form-group">
          <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px;">
            <label class="modal-form-label" for="pinned-note-text" style="margin-bottom: 0;">Note Message</label>
            <span id="pinned-note-word-count" style="font-size: 0.85rem; color: #7d756d; font-weight: 600;">0 / 18 words</span>
          </div>
          <textarea 
            class="modal-form-input" 
            id="pinned-note-text" 
            rows="3" 
            placeholder="e.g. remember to check the rhyme scheme in verse 2..." 
            required 
            maxlength="200"
            style="resize: vertical; font-family: 'Caveat', cursive; font-size: 1.5rem; line-height: 1.2;"
          ></textarea>
        </div>

        <div class="modal-form-group">
          <label class="modal-form-label">Paper Color</label>
          <div class="pinned-color-picker" id="pinned-color-picker">
            <label class="pinned-color-opt">
              <input type="radio" name="pinned-color" value="pink" checked />
              <span class="pinned-color-swatch swatch-pink" title="Pink Tape Note"></span>
            </label>
            <label class="pinned-color-opt">
              <input type="radio" name="pinned-color" value="blue" />
              <span class="pinned-color-swatch swatch-blue" title="Blue Tape Note"></span>
            </label>
            <label class="pinned-color-opt">
              <input type="radio" name="pinned-color" value="yellow" />
              <span class="pinned-color-swatch swatch-yellow" title="Yellow Tape Note"></span>
            </label>
            <label class="pinned-color-opt">
              <input type="radio" name="pinned-color" value="green" />
              <span class="pinned-color-swatch swatch-green" title="Green Tape Note"></span>
            </label>
            <label class="pinned-color-opt">
              <input type="radio" name="pinned-color" value="purple" />
              <span class="pinned-color-swatch swatch-purple" title="Purple Tape Note"></span>
            </label>
          </div>
        </div>

        <div class="task-modal-actions">
          <button type="button" class="task-btn-cancel" id="btn-cancel-pinned-note">Cancel</button>
          <button type="submit" class="task-btn-save" id="btn-save-pinned-note">Pin Note</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Custom Dialog Modal (Replaces browser alert and confirm) -->
  <div class="task-modal-backdrop view-hidden" id="custom-dialog-modal" style="z-index: 99999;">
    <div class="task-modal-card custom-dialog-card" role="alertdialog" aria-modal="true">
      <div class="custom-dialog-body">
        <div class="custom-dialog-icon" id="custom-dialog-icon">ℹ️</div>
        <div class="custom-dialog-text-wrap">
          <h4 class="custom-dialog-title" id="custom-dialog-title">Notice</h4>
          <p class="custom-dialog-message" id="custom-dialog-message"></p>
        </div>
      </div>
      <div class="task-modal-actions custom-dialog-actions" id="custom-dialog-actions">
        <button type="button" class="task-btn-cancel" id="custom-dialog-cancel" style="display:none;">Cancel</button>
        <button type="button" class="task-btn-save" id="custom-dialog-confirm">
          <span id="custom-dialog-confirm-text">OK</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Floating Teacher Pen Toolbar (Palette) -->
  <div class="teacher-pen-toolbar view-hidden" id="teacher-pen-toolbar" role="toolbar" aria-label="Teacher Grading Pen Controls">
    <div class="pen-toolbar-handle" id="pen-toolbar-handle" title="Teacher Marking Palette">
      <i class="fi fi-rr-pen-nib" id="pen-toolbar-icon" style="color: #e03131;"></i>
      <span class="pen-toolbar-title" id="pen-toolbar-title">Red Pen</span>
    </div>

    <div class="pen-toolbar-sep"></div>

    <!-- Tool Selector -->
    <div class="pen-tool-group" id="pen-tool-group">
      <button type="button" class="pen-tool-btn active" data-tool="pen" title="Freehand Drawing Pen">
        <i class="fi fi-rr-pen-nib"></i>
      </button>
      <button type="button" class="pen-tool-btn teacher-only-tool" data-tool="check" title="Quick Grade: Checkmark (✓) [Teacher Only]">
        <i class="fi fi-rr-check" style="color: #2b8a3e;"></i>
      </button>
      <button type="button" class="pen-tool-btn teacher-only-tool" data-tool="cross" title="Quick Grade: Cross (✗) [Teacher Only]">
        <i class="fi fi-rr-cross" style="color: #e03131;"></i>
      </button>
      <button type="button" class="pen-tool-btn teacher-only-tool" data-tool="star" title="Quick Grade: Gold Star (⭐) [Teacher Only]">
        <span style="font-size: 14px;">⭐</span>
      </button>
      <button type="button" class="pen-tool-btn" data-tool="eraser" title="Eraser: Remove marks">
        <i class="fi fi-rr-eraser"></i>
      </button>
    </div>

    <div class="pen-toolbar-sep"></div>

    <!-- Color Swatches -->
    <div class="pen-color-group" id="pen-color-group">
      <button type="button" class="pen-color-swatch teacher-only-color active" id="pen-swatch-red" data-color="#e03131" style="--pen-swatch-color: #e03131;" title="Teacher Red [Teacher Only]"></button>
      <button type="button" class="pen-color-swatch" id="pen-swatch-blue" data-color="#1971c2" style="--pen-swatch-color: #1971c2;" title="Electric Blue"></button>
      <button type="button" class="pen-color-swatch" id="pen-swatch-green" data-color="#2f9e44" style="--pen-swatch-color: #2f9e44;" title="Teacher Green"></button>
      <button type="button" class="pen-color-swatch" id="pen-swatch-yellow" data-color="#f59f00" style="--pen-swatch-color: #f59f00;" title="Gold Yellow"></button>
      <button type="button" class="pen-color-swatch" id="pen-swatch-black" data-color="#1a1816" style="--pen-swatch-color: #1a1816;" title="Charcoal Ink"></button>
    </div>

    <div class="pen-toolbar-sep"></div>

    <!-- Stroke Width Selector -->
    <div class="pen-size-group">
      <button type="button" class="pen-size-btn" data-size="2" title="Fine Stroke (2px)">
        <span class="pen-size-dot dot-sm"></span>
      </button>
      <button type="button" class="pen-size-btn active" data-size="3.5" title="Medium Stroke (3.5px)">
        <span class="pen-size-dot dot-md"></span>
      </button>
      <button type="button" class="pen-size-btn" data-size="7" title="Thick Stroke (7px)">
        <span class="pen-size-dot dot-lg"></span>
      </button>
    </div>

    <div class="pen-toolbar-sep"></div>

    <!-- Undo & Clear Actions -->
    <div class="pen-action-group">
      <button type="button" class="pen-action-btn" id="btn-pen-undo" title="Undo Last Pen Mark">
        <i class="fi fi-rr-undo"></i>
      </button>
      <button type="button" class="pen-action-btn" id="btn-pen-clear" title="Clear All Marks on Active Page">
        <i class="fi fi-rr-trash"></i>
      </button>
    </div>

    <div class="pen-toolbar-sep"></div>

    <!-- Close / Exit Pen Mode -->
    <button type="button" class="pen-btn-done" id="btn-pen-done" title="Finish handwriting / switch back to text">
      <i class="fi fi-rr-check"></i>
      <span>Done</span>
    </button>
  </div>

  <!-- In-App Floating Toast Container -->
  <div class="inapp-toast-container" id="inapp-toast-container" aria-live="polite" aria-atomic="true"></div>

  <!-- Firebase SDKs (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-storage-compat.js"></script>

  <!-- Quill-Q Shared Scripts -->
  <script src="firebase-config.js"></script>
  <script src="academic-config.js"></script>
  <script src="subjects-config.js"></script>
  <script src="custom-dialog.js"></script>

  <!-- React + BlockNote + Mantine Bundle -->
  <script src="libs/blocknote-react.bundle.js?v=10"></script>

  <!-- BlockNote Standalone Editor Controller -->
  <script src="editor.js?v=30"></script>
</body>
</html>
